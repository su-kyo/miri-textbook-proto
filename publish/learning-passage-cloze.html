<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="../" />
    <title>지문 읽기</title>
    <link rel="stylesheet" href="shared/css/base.css?v=20260724a" />
    <link rel="stylesheet" href="shared/css/learning-shell.css?v=20260724a" />
    <link rel="stylesheet" href="shared/css/learning-components.css?v=20260724a" />
    <script>
      (function () {
        if (window.location.protocol !== "file:") return;
        var path = decodeURIComponent(window.location.pathname).replace(/\\/g, "/");
        var marker = "/MT/";
        var index = path.lastIndexOf(marker);
        if (index === -1) return;
        var relative = path.slice(index + marker.length);
        window.location.replace("http://127.0.0.1:8000/" + relative + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body class="publish-body learning-publish-body theme-light" data-page="learning-passage-cloze">
    <div class="learning-preview">
      <main class="learning-shell learning-shell--header-48 learning-shell--wide" aria-label="지문 읽기 화면">
        <header class="learning-header">
          <div class="learning-header__inner">
            <div class="learning-header__left">
              <a class="learning-icon-button" href="publish/learning-vocab-mc.html" aria-label="이전 학습으로 돌아가기">
                <img src="asset/icons/common/back.svg" alt="" />
              </a>
              <div class="learning-curriculum" data-curriculum-label></div>
            </div>
            <button class="learning-theme-toggle" type="button" aria-label="라이트 모드와 다크 모드 전환" aria-pressed="false" data-theme-toggle>
              <span class="learning-theme-toggle__icon" aria-hidden="true"><img src="asset/icons/constellation/light.svg" alt="" /></span>
              <span class="learning-theme-toggle__icon" aria-hidden="true"><img src="asset/icons/constellation/dark.svg" alt="" /></span>
            </button>
          </div>
        </header>

        <section class="learning-content">
          <div class="learning-content__inner learning-content__inner--passage-cloze">
            <div class="learning-step-info">
              <strong>지문 읽기</strong>
              <span>지문을 읽고 빈칸에 알맞은 낱말을 골라보세요.</span>
            </div>

            <article class="learning-card passage-card">
              <div class="passage-card__body">
                <div class="passage-card__header">
                  <h1 class="passage-card__title" data-passage-title></h1>
                </div>
                <p class="passage-flow" data-passage-flow></p>
              </div>
            </article>

          </div>
        </section>

        <footer class="learning-footer">
          <div class="learning-footer__inner">
            <div class="learning-footer__inline-tools">
              <button class="learning-footer__tool" type="button" aria-label="글자 크기 줄이기" data-font-minus>-</button>
              <button class="learning-footer__tool" type="button" aria-label="글자 크기 키우기" data-font-plus>+</button>
            </div>
            <button class="learning-footer__cta" type="button" aria-disabled="true" data-footer-cta>다음 학습으로</button>
          </div>
        </footer>

        <div class="learning-overlay-layer">
          <section class="bottom-sheet" hidden data-cloze-sheet>
            <div class="bottom-sheet__panel">
              <div class="bottom-sheet__handle"></div>
              <div data-cloze-options></div>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="publish/js/learning-publish-init.js?v=20260724a"></script>
  </body>
</html>
