<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="../" />
    <title>진단평가</title>
    <link rel="stylesheet" href="shared/css/base.css?v=20260724i" />
    <link rel="stylesheet" href="shared/css/learning-shell.css?v=20260724i" />
    <link rel="stylesheet" href="shared/css/learning-components.css?v=20260724i" />
    <script>
      (function () {
        if (window.location.protocol !== "file:") return;
        var path = decodeURIComponent(window.location.pathname).replace(/\\/g, "/");
        var marker = "/MT/";
        var index = path.lastIndexOf(marker);
        if (index === -1) return;
        var relative = path.slice(index + marker.length);
        window.location.replace("http://127.0.0.1:8000/" + relative + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body class="publish-body learning-publish-body theme-light" data-page="diagnostic-quiz">
    <div class="learning-preview">
      <main class="learning-shell learning-shell--header-48 learning-shell--wide" aria-label="진단평가 화면">
        <header class="learning-header">
          <div class="learning-header__inner">
            <div class="learning-header__left">
              <a class="learning-icon-button" href="publish/home.html" aria-label="진단평가 나가기">
                <img src="asset/icons/common/back.svg" alt="" />
              </a>
              <div class="learning-curriculum" data-curriculum-label>진단평가</div>
            </div>
            <button class="learning-theme-toggle" type="button" aria-label="라이트 모드와 다크 모드 전환" aria-pressed="false" data-theme-toggle>
              <span class="learning-theme-toggle__icon" aria-hidden="true"><img src="asset/icons/constellation/light.svg" alt="" /></span>
              <span class="learning-theme-toggle__icon" aria-hidden="true"><img src="asset/icons/constellation/dark.svg" alt="" /></span>
            </button>
          </div>
        </header>

        <section class="learning-content">
          <div class="learning-content__inner learning-content__inner--quiz-top" data-diagnostic-root></div>
        </section>

        <footer class="learning-footer">
          <div class="learning-footer__inner learning-footer__inner--split">
            <button class="learning-footer__prev" type="button" hidden data-diagnostic-prev>이전</button>
            <button class="learning-footer__cta" type="button" aria-disabled="true" data-diagnostic-cta>다음</button>
          </div>
        </footer>

        <div class="learning-overlay-layer">
          <section class="bottom-sheet bottom-sheet--full diagnostic-passage-sheet" hidden data-diagnostic-passage-sheet>
            <div class="bottom-sheet__panel">
              <article class="learning-card passage-card diagnostic-passage-sheet__card">
                <div class="passage-card__body diagnostic-passage" data-diagnostic-passage-sheet-body></div>
              </article>
              <button class="diagnostic-passage-sheet__back" type="button" data-diagnostic-passage-close>문제 보기</button>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="publish/js/diagnostic-init.js?v=20260724i"></script>
  </body>
</html>
