<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="../../" />
    <title>프로토타입 학습 완료</title>
    <link rel="stylesheet" href="shared/css/base.css?v=20260731e" />
    <link rel="stylesheet" href="shared/css/learning-shell.css?v=20260731e" />
    <link rel="stylesheet" href="shared/css/learning-components.css?v=20260731e" />
    <script>
      (function () {
        if (window.location.protocol !== "file:") return;
        var path = decodeURIComponent(window.location.pathname).replace(/\\/g, "/");
        var marker = "/MT/";
        var index = path.lastIndexOf(marker);
        if (index === -1) return;
        var relative = path.slice(index + marker.length);
        window.location.replace("http://127.0.0.1:8000/" + relative + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body class="prototype-body learning-publish-body theme-light" data-page="learning-complete" data-mode="prototype">
    <div class="learning-preview">
      <main class="learning-shell learning-shell--header-48 learning-shell--footerless learning-shell--wide" aria-label="프로토타입 학습 완료 화면">
        <header class="learning-header">
          <div class="learning-header__inner">
            <div class="learning-header__left">
              <a class="learning-icon-button" href="prototype/pages/home.html" aria-label="학습 홈으로 이동" data-complete-back-link>
                <img src="asset/icons/common/back.svg" alt="" />
              </a>
              <div class="learning-curriculum" data-curriculum-label></div>
            </div>
            <button class="learning-theme-toggle" type="button" aria-label="라이트 모드와 다크 모드 전환" aria-pressed="false" data-theme-toggle>
              <span class="learning-theme-toggle__icon" aria-hidden="true"><img src="asset/icons/constellation/light.svg" alt="" /></span>
              <span class="learning-theme-toggle__icon" aria-hidden="true"><img src="asset/icons/constellation/dark.svg" alt="" /></span>
            </button>
          </div>
        </header>

        <section class="learning-content">
          <div class="learning-content__inner learning-content__inner--complete">
            <section class="complete-card">
              <div class="complete-card__badge" aria-hidden="true">
                <img src="asset/icons/common/done.svg" alt="" />
              </div>

              <div class="complete-card__copy">
                <h1 class="complete-card__title">학습 완료!</h1>
                <p class="complete-card__subtitle" data-complete-round></p>
              </div>

              <div class="complete-card__score">
                <p class="complete-card__score-label">이번 학습 점수</p>
                <p class="complete-card__score-value" data-complete-score></p>
              </div>

              <p class="complete-card__caption">지난 결과는 기록에서 다시 확인할 수 있어요.</p>
            </section>

            <div class="complete-actions">
              <a class="complete-actions__primary" href="prototype/pages/learning-result.html" data-complete-result-link>결과 보기</a>
              <a class="complete-actions__secondary" href="prototype/pages/home.html" data-complete-home-link>학습 홈으로</a>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="publish/js/learning-publish-init.js?v=20260731e"></script>
  </body>
</html>
